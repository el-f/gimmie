[global]
  p: __GIMMIE_PORT__
  # only the tunnel needs to reach it
  i: 127.0.0.1
  # login mode comes from require_username in gimmie.toml
  __GIMMIE_LOGIN_OPTIONS__
  no-crt
  xff-hdr: cf-connecting-ip
  xff-src: 127.0.0.1
  # without rproxy, every tunnel client is 127.0.0.1, so one auto-ban locks everyone out
  rproxy: -1
  xf-proto-fb: https
  # more parallel chunks for the high-latency tunnel path (default 2)
  u2j: 4
  # the default is the machine's hostname, shown to every visitor of the public URL
  name: gimmie
  # an uploaded .html, .prologue.html or README.md must not run or render in the admin's browser
  no-html
  no-logues
  no-readme

[/incoming]
  __GIMMIE_INCOMING_DIR__
  accs:
    rw: __GIMMIE_ADMIN_USERS__
    w: __GIMMIE_UPLOAD_USERS__
  flags:
    df: 5g
